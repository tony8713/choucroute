# earbox ORIN (brain) config. Copy to ~/.config/earbox/orin.toml on the Orin.
# Jetson Orin Nano Super, JetPack 6.x.

# Input mode:
#   direct = capture the local reSpeaker XVF3800 USB mic (FOUNDER UNIT, no LAN)
#   lan    = TLS server; Pi satellites stream rooms in (OPTIONAL multi-room)
mode = "direct"

# ---- transcription (LOCAL, on the Orin GPU) --------------------------------
stt_backend = "faster_whisper"   # faster_whisper | whisper_cli | echo
fw_model_size = "small"          # small|medium ; benchmark BOTH int8 on-device (D3)
fw_device = "cpu"                # cpu int8 small runs ~16s / 60s audio (under realtime) on Orin.
                                 # "cuda" needs a JetPack-native CTranslate2 build; the stock
                                 # pip wheel is CPU-only and raises "not compiled with CUDA support".
fw_compute_type = "int8"
fw_beam_size = 1
fw_vad_filter = true
language = "fr"                  # "auto" to detect (slower)

# ---- anti-hallucination filtering (reject invented text on silence) --------
# STT hallucinates subtitle-ghost phrases on quiet/near-silent audio; these
# gates reject those segments so the 24/7 memory never invents. Tune freely
# without code edits. Quality on clear speech is unaffected.
fw_condition_on_previous_text = false  # kills "C'est ça" x7 self-feeding loops on noise
fw_temperature = 0.0                   # deterministic decode; no sampling that invents
fw_no_speech_threshold = 0.6           # DROP any segment with no_speech_prob above this
fw_min_avg_logprob = -1.0              # DROP any segment with avg_logprob below this
fw_log_prob_threshold = -1.0           # whisper-internal silence gate
fw_compression_ratio_threshold = 2.4   # whisper-internal degenerate-repeat gate
fw_hallucination_silence_threshold = 2.0  # applied only if the installed fw supports it
fw_vad_threshold = 0.5                  # vad speech-probability gate
fw_vad_min_silence_ms = 500            # silence run that splits speech (strongest lever)
fw_vad_speech_pad_ms = 200             # pad kept speech so words aren't clipped
# hallucination_blacklist_file = ""    # "" = packaged common/hallucinations.txt (editable)
filter_min_chars = 2                    # drop near-empty / punctuation-only segments
filter_drop_repeated_token = true      # drop a single short token repeated (Sssshhh Sssshhh)

# whisper_cli fallback (only used if stt_backend = "whisper_cli"):
whisper_bin = "whisper-cli"
model_path = "/opt/earbox/models/ggml-base.bin"
whisper_threads = 6

# ---- direct mode: reSpeaker XVF3800 USB capture ----------------------------
# The XVF3800 enumerates as a USB audio device. Feed whisper the DSP-PROCESSED
# ASR channel (post beamforming/NS/AEC/AGC), NOT the raw mic channels.
# VERIFY device + channel layout on-device: `arecord -l` / `arecord -L`.
# Use a DIRECT ALSA hw device, NOT "default": under systemd there is no user
# session, so "default" routes through PulseAudio which has no runtime dir and
# fails ("Failed to symlink .../pulse/...runtime, Read-only file system"),
# capturing nothing. hw:0,0 = the reSpeaker XVF3800 (card 0 on the founder Orin;
# confirm your card index with `arecord -l`).
usb_capture_device = "hw:0,0"    # DIRECT ALSA; NOT "default" (pulse). Verify card idx via `arecord -l`.
usb_channels = 2                 # XVF3800 presents 2ch @ S16_LE/16k; capture both, down-select ASR ch below
usb_asr_channel = 0              # index of the processed ASR channel to feed whisper

# ---- denoise (OPTIONAL pre-processing; DEFAULT OFF) ------------------------
# The XVF3800 already does noise suppression + AEC + AGC on-chip, so software
# denoise is off by default. Enable + set denoise_cmd only for raw-mic paths or
# once Laurent's chain lands (name PENDING). denoise_cmd: wav on stdin -> wav on
# stdout.
denoise_enabled = false
# denoise_cmd = "laurent-denoise --rate 16000"

# ---- memory (git-backed, text only) ----------------------------------------
memory_repo = "/home/earbox/earbox-memory"
auto_commit = true

# Scratch: MUST be tmpfs so raw audio never touches persistent storage.
scratch_dir = "/dev/shm/earbox"

# ---- VAD (energy gate) -----------------------------------------------------
segment_seconds = 30
sample_rate = 16000
vad_rms_threshold = 0.012
vad_min_voiced_ratio = 0.06

# ---- mute ------------------------------------------------------------------
mute_flag = "/home/earbox/.earbox-muted"
gpio_mute_pin = 0

# ---- lan mode: satellite TLS server ----------------------------------------
listen_host = "0.0.0.0"
listen_port = 7217
tls_certfile = "/opt/earbox/tls/orin.crt"
tls_keyfile = "/opt/earbox/tls/orin.key"
mdns_advertise = true
mdns_instance = "earbox-orin"

# Safety: never enable in production. Keeps raw audio on disk for debugging.
keep_debug_audio = false
