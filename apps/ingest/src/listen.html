<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>earbox live listen</title>
<style>
  :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { margin: 0; padding: 24px; max-width: 760px; margin-inline: auto; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; opacity: 0.6; font-size: 12px; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid currentColor; background: transparent; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  .row { display: flex; gap: 16px; align-items: center; margin: 16px 0; flex-wrap: wrap; }
  canvas { width: 100%; height: 140px; border: 1px solid rgba(128,128,128,0.4); border-radius: 8px; display: block; background: rgba(128,128,128,0.06); }
  .meter { height: 14px; flex: 1; min-width: 160px; background: rgba(128,128,128,0.2); border-radius: 7px; overflow: hidden; }
  .meter > div { height: 100%; width: 0%; background: #3fb950; transition: width 60ms linear; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 16px 0 0; }
  dt { opacity: 0.6; } dd { margin: 0; }
  .status { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(128,128,128,0.15); }
</style>
</head>
<body>
  <h1>earbox live listen</h1>
  <p class="sub">subscribes to the Fly ingest fan-out and plays the box's live PCM S16LE / 16 kHz / mono.</p>

  <div class="row">
    <button id="start">Start listening</button>
    <span class="status" id="status">idle</span>
  </div>

  <canvas id="wave" width="1520" height="280"></canvas>

  <div class="row">
    <span style="font-size:12px;opacity:.6">level</span>
    <div class="meter"><div id="level"></div></div>
  </div>

  <dl>
    <dt>chunks</dt><dd id="chunks">0</dd>
    <dt>bytes</dt><dd id="bytes">0</dd>
    <dt>audio seconds</dt><dd id="secs">0.0</dd>
    <dt>buffer ahead</dt><dd id="ahead">0 ms</dd>
  </dl>

<script>
(() => {
  const SAMPLE_RATE = 16000;
  const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/subscribe';
  const $ = (id) => document.getElementById(id);
  const canvas = $('wave'), g = canvas.getContext('2d');
  let ctx = null, ws = null, nextTime = 0, chunks = 0, bytes = 0;

  function draw(float32) {
    const w = canvas.width, h = canvas.height, mid = h / 2;
    g.clearRect(0, 0, w, h);
    g.strokeStyle = '#3fb950'; g.lineWidth = 1.5; g.beginPath();
    const step = Math.max(1, Math.floor(float32.length / w));
    for (let x = 0; x < w; x++) {
      const s = float32[Math.min(float32.length - 1, x * step)] || 0;
      const y = mid - s * mid * 0.95;
      if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }

  function onChunk(buf) {
    const i16 = new Int16Array(buf);
    const f32 = new Float32Array(i16.length);
    let sumSq = 0;
    for (let i = 0; i < i16.length; i++) { const v = i16[i] / 32768; f32[i] = v; sumSq += v * v; }
    chunks++; bytes += buf.byteLength;
    $('chunks').textContent = chunks;
    $('bytes').textContent = bytes.toLocaleString();
    $('secs').textContent = (bytes / (SAMPLE_RATE * 2)).toFixed(1);
    const rms = Math.sqrt(sumSq / i16.length);
    $('level').style.width = Math.min(100, rms * 320).toFixed(0) + '%';
    draw(f32);
    const ab = ctx.createBuffer(1, f32.length, SAMPLE_RATE);
    ab.copyToChannel(f32, 0);
    const src = ctx.createBufferSource();
    src.buffer = ab; src.connect(ctx.destination);
    const now = ctx.currentTime;
    if (nextTime < now) nextTime = now + 0.08;
    src.start(nextTime);
    nextTime += ab.duration;
    $('ahead').textContent = Math.max(0, (nextTime - now) * 1000).toFixed(0) + ' ms';
  }

  function connect() {
    ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { $('status').textContent = 'connected'; };
    ws.onclose = () => { $('status').textContent = 'disconnected — retrying'; setTimeout(connect, 1000); };
    ws.onerror = () => { $('status').textContent = 'error'; };
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') return;
      onChunk(ev.data);
    };
  }

  $('start').onclick = async () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    await ctx.resume();
    $('start').disabled = true;
    $('status').textContent = 'connecting';
    connect();
  };
})();
</script>
</body>
</html>
